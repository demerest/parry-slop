<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>parry-slop harness</title>
</head>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
  <canvas id="game"></canvas>
  <pre id="out" style="padding:8px;white-space:pre-wrap"></pre>
  <script>
    window.__PS_NO_LOOP = true;
    try {
      localStorage.clear();
      localStorage.setItem("parrySlop.muted", "true");
    } catch (e) {}
    window.__errors = [];
    window.onerror = function (msg, src, line) {
      window.__errors.push(msg + " @ " + src + ":" + line);
    };
  </script>
  <script src="../src/core.js"></script>
  <script src="../src/audio.js"></script>
  <script src="../src/attacks.js"></script>
  <script src="../src/game.js"></script>
  <script src="../src/render.js"></script>
  <script src="../src/main.js"></script>
  <script src="run.js"></script>
</body>
</html>
